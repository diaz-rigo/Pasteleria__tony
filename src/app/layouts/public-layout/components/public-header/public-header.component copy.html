<header class="sticky top-0 z-50" [ngStyle]="{ 'background-color': config()?.headerBackgroundColor || '#ffffff' }">
  <nav class="container mx-auto px-4 py-3 flex justify-between items-center">

    <!-- Botón hamburguesa (solo móvil) -->
    <button aria-label="Menú"
      class="md:hidden p-2 rounded-full transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-opacity-50"
      [ngStyle]="{ 'color': getTextColor(config()?.headerBackgroundColor || '#ffffff') }" (click)="toggleMobileMenu()">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <!-- Logo o Título -->
    <a routerLink="/" class="flex items-center md:ml-28 mx-auto md:mx-0 group">
      <ng-container *ngIf="config()?.showheaderImage; else titleText">
        <img
          src="https://res.cloudinary.com/dvvhnrvav/image/upload/v1749933866/pasteleria-tony/pngs/htl76bq1jvkr20sn1e9b.png"
          alt="Pastelería Tony Logo" class="h-10 md:h-14 w-auto max-w-[160px] md:max-w-[220px]" />
      </ng-container>
      <ng-template #titleText>
        <span class="text-xl md:text-2xl font-bold tracking-tight"
          [style.color]="getTextColor(config()?.headerBackgroundColor || '#ffffff')">
          {{ config()?.heroTitle }}
        </span>
      </ng-template>
    </a>

    <!-- Navegación principal -->
    <div class="hidden md:flex space-x-1">
      <a *ngFor="let link of [
            { label: 'Inicio', path: '/' },
            { label: 'Productos', path: '/productos' },
            { label: 'Contacto', path: '/contacto' },
            
          ]" [routerLink]="link.path" class="relative px-4 py-2 transition-colors duration-300 group"
        [ngStyle]="{ 'color': isActive(link.path) ? '#d4af37' : getTextColor(config()?.headerBackgroundColor || '#ffffff') }">
        {{ link.label }}
        <span
          class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-0 h-0.5 bg-gold-500 transition-all duration-300 group-hover:w-3/4"></span>
        <span *ngIf="isActive(link.path)"
          class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-3/4 h-0.5 bg-gold-500"></span>
      </a>
    </div>

    <!-- Iconos acción -->
    <div class="flex items-center space-x-2">
      <!-- Buscar -->
      <button aria-label="Buscar" class="hidden md:block p-2 rounded-full transition duration-300"
        [ngStyle]="{ 'color': getTextColor(config()?.headerBackgroundColor || '#ffffff') }">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </button>

      <!-- Carrito -->
      <button aria-label="Carrito" class="relative p-2 rounded-full transition duration-300"
        [ngStyle]="{ 'color': getTextColor(config()?.headerBackgroundColor || '#ffffff') }" (click)="openCart()">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z">
          </path>
        </svg>
        @if (cartItems > 0) {
        <span
          class="absolute -top-1 -right-1 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center transition-transform"
          style="background-color: #212121">
          {{ cartItems }}
        </span>
        }
      </button>

      <!-- Login -->
      <button aria-label="Iniciar sesión"
        class="hidden md:flex items-center border space-x-1 px-3 py-1.5 rounded-full transition-colors duration-300"
        [ngStyle]="{
                'background-color': getTextColor(config()?.headerBackgroundColor || '#ffffff'),
                'color': config()?.headerBackgroundColor || '#000000'
              }" (click)="openLogin()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <span class="text-sm font-semibold">Ingresar</span>
      </button>

      <!-- Login móvil -->
      <button aria-label="Iniciar sesión" class="md:hidden p-2 rounded-full transition duration-300"
        [ngStyle]="{ 'color': getTextColor(config()?.headerBackgroundColor || '#ffffff') }" (click)="openLogin()">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
      </button>
    </div>
  </nav>

  <!-- Menú móvil: puedes aplicar lo mismo si deseas para los textos -->
</header>
