<header class="sticky top-0 z-50" [ngStyle]="{ 'background-color': config()?.headerBackgroundColor || '#ffffff' }"
  (keydown.escape)="closeMobileMenu()">
  <nav class="container mx-auto px-4 py-3 flex justify-between items-center">

    <!-- Botón hamburguesa (solo móvil) -->
    <button aria-label="Menú" aria-haspopup="dialog" [attr.aria-expanded]="mobileMenuOpen" aria-controls="mobileSidebar"
      class="md:hidden p-2 rounded-full transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-opacity-50"
      [ngStyle]="{ 'color': getTextColor(config()?.headerBackgroundColor || '#ffffff') }" (click)="toggleMobileMenu()">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <!-- Logo o Título -->
    <a routerLink="/" class="flex items-center md:ml-28 mx-auto md:mx-0 group" (click)="closeMobileMenu()">
      <ng-container *ngIf="config()?.showheaderImage; else titleText">
        <img
          src="https://res.cloudinary.com/dvvhnrvav/image/upload/v1749933866/pasteleria-tony/pngs/htl76bq1jvkr20sn1e9b.png"
          alt="Pastelería Tony Logo" class="h-10 md:h-14 w-auto max-w-[160px] md:max-w-[220px]" />
      </ng-container>
      <ng-template #titleText>
        <span class="text-xl md:text-2xl font-bold tracking-tight"
          [style.color]="getTextColor(config()?.headerBackgroundColor || '#ffffff')">
          {{ config()?.heroTitle }}
        </span>
      </ng-template>
    </a>

    <!-- Navegación principal (desktop) -->
    <div class="hidden md:flex space-x-1">
      <a *ngFor="let link of navLinks" [routerLink]="link.path"
        class="relative px-4 py-2 transition-colors duration-300 group"
        [ngStyle]="{ 'color': isActive(link.path) ? '#d4af37' : getTextColor(config()?.headerBackgroundColor || '#ffffff') }">
        {{ link.label }}
        <span
          class="absolute bottom-0 left-1/2 -translate-x-1/2 w-0 h-0.5 bg-gold-500 transition-all duration-300 group-hover:w-3/4"></span>
        <span *ngIf="isActive(link.path)"
          class="absolute bottom-0 left-1/2 -translate-x-1/2 w-3/4 h-0.5 bg-gold-500"></span>
      </a>
    </div>

    <!-- Iconos acción -->
    <div class="flex items-center space-x-2">
      <!-- Buscar -->
      <button aria-label="Buscar" class="hidden md:block p-2 rounded-full transition duration-300"
        [ngStyle]="{ 'color': getTextColor(config()?.headerBackgroundColor || '#ffffff') }">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </button>
      <!-- Rastrear pedido (CTA) -->
<button aria-label="Rastrear pedido"
  class="hidden md:inline-flex items-center border space-x-2 px-3 py-1.5 rounded-full transition-colors duration-300"
  [ngStyle]="{
    'background-color': getTextColor(config()?.headerBackgroundColor || '#ffffff'),
    'color': config()?.headerBackgroundColor || '#000000'
  }"
  (click)="openTrack()">
  <span class="material-symbols-rounded text-base">local_shipping</span>
  <span class="text-sm font-semibold">Rastrear</span>
</button>


      <!-- Carrito -->
      <button aria-label="Carrito" class="relative p-2 rounded-full transition duration-300"
        [ngStyle]="{ 'color': getTextColor(config()?.headerBackgroundColor || '#ffffff') }" (click)="openCart()">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z">
          </path>
        </svg>
        @if (cartItems > 0) {
        <span
          class="absolute -top-1 -right-1 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center transition-transform"
          style="background-color: #212121">
          {{ cartItems }}
        </span>
        }
      </button>

      <!-- Login desktop -->
      <button aria-label="Iniciar sesión"
        class="hidden md:flex items-center border space-x-1 px-3 py-1.5 rounded-full transition-colors duration-300"
        [ngStyle]="{
          'background-color': getTextColor(config()?.headerBackgroundColor || '#ffffff'),
          'color': config()?.headerBackgroundColor || '#000000'
        }" (click)="openLogin()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <span class="text-sm font-semibold">Ingresar</span>
      </button>

      <!-- Login móvil -->
      <button aria-label="Iniciar sesión" class="md:hidden p-2 rounded-full transition duration-300"
        [ngStyle]="{ 'color': getTextColor(config()?.headerBackgroundColor || '#ffffff') }" (click)="openLogin()">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
      </button>
    </div>
  </nav>
<div *ngIf="trackOpen()" class="fixed inset-0 z-[60]">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black/40" (click)="closeTrack()"></div>

  <!-- Dialog -->
  <div class="absolute inset-0 flex items-center justify-center p-4">
    <div class="w-full max-w-sm rounded-2xl bg-white shadow-2xl ring-1 ring-black/5">
      <!-- Header -->
      <div class="p-4 border-b flex items-center justify-between">
        <h3 class="text-sm font-semibold text-slate-900">Rastrear pedido</h3>
        <button class="p-2 rounded-full hover:bg-slate-100 flex items-center justify-center"
                (click)="closeTrack()" aria-label="Cerrar">
          <span class="material-symbols-rounded text-base">close</span>
        </button>
      </div>

      <!-- Body -->
      <div class="p-4 space-y-3">
        <label class="block text-xs text-slate-600">Código de pedido</label>
        <input
          type="text"
          class="w-full rounded-lg border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-900/10"
          placeholder="Ej. ABC1234"
          [ngModel]="trackCode()"
          (ngModelChange)="trackCode.set($event)"
          (keydown.enter)="goTrack()"
          autocomplete="off"
          autofocus
        />

        <button
          class="w-full inline-flex items-center justify-center gap-2 rounded-lg bg-black text-white px-3 py-2 text-sm"
          (click)="goTrack()">
          <span class="material-symbols-rounded text-base">local_shipping</span>
          <span>Rastrear</span>
        </button>

        <p class="text-[11px] text-slate-500">
          Ingresa el código que recibiste en tu confirmación (WhatsApp o correo).
        </p>
      </div>
    </div>
  </div>
</div>

  <!-- ====== SIDEBAR MÓVIL ====== -->
  <div *ngIf="mobileMenuOpen" class="md:hidden">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/40 backdrop-blur-[1px] transition-opacity" (click)="closeMobileMenu()"></div>

    <!-- Drawer -->
    <aside id="mobileSidebar" role="dialog" aria-modal="true" class="fixed inset-y-0 left-0 w-80 max-w-[85vw] bg-white shadow-2xl ring-1 ring-black/5
             translate-x-0 animate-[slideIn_.25s_ease-out] will-change-transform flex flex-col">
      <!-- Header del sidebar -->
      <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-base font-semibold">Menú</span>
        </div>
        <button class="p-2 rounded-full hover:bg-gray-100" (click)="closeMobileMenu()" aria-label="Cerrar menú">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Links -->
      <nav class="flex-1 overflow-y-auto">
        <ul class="p-2">
          <li *ngFor="let link of navLinks">
            <a [routerLink]="link.path" (click)="closeMobileMenu()" class="flex items-center justify-between px-3 py-3 rounded-lg text-sm font-medium
                      hover:bg-gray-50 active:bg-gray-100 transition"
              [ngStyle]="{ 'color': isActive(link.path) ? '#d4af37' : '#111827' }">
              <span>{{ link.label }}</span>
              <span *ngIf="isActive(link.path)" class="inline-block h-2 w-2 rounded-full bg-pink-500"></span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- Acciones rápidas -->
      <div class="border-t border-gray-100 p-3 grid grid-cols-2 gap-2">
        <button (click)="openTrack(); closeMobileMenu()"
          class="inline-flex items-center justify-center gap-2 rounded-xl border px-3 py-2 text-sm">
    <span class="material-symbols-rounded text-base">local_shipping</span>

          Rastrear
        </button>

        <button (click)="openCart(); closeMobileMenu()"
          class="inline-flex items-center justify-center gap-2 rounded-xl border px-3 py-2 text-sm">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          Carrito
        </button>
        <button (click)="openLogin(); closeMobileMenu()"
          class="inline-flex items-center justify-center gap-2 rounded-xl bg-black text-white px-3 py-2 text-sm">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          Ingresar
        </button>
      </div>
    </aside>
  </div>
</header>

<!-- Animación simple -->
<style>
  @keyframes slideIn {
    from {
      transform: translateX(-100%);
    }

    to {
      transform: translateX(0);
    }
  }
</style>
