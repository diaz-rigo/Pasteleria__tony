<div class="flex flex-col md:flex-row h-screen bg-gray-100">
  <!-- Sidebar -->
<app-admin-sidebar 
  class="fixed md:relative inset-y-0 left-0 z-50 w-64 transform md:transform-none transition-transform duration-200 ease-in-out"
  [class.translate-x-0]="sidebarOpen() || isDesktop()"
  [class.-translate-x-full]="!sidebarOpen() && !isDesktop()"
  [open]="sidebarOpen() || isDesktop()"
  (close)="sidebarOpen.set(false)">
</app-admin-sidebar>
  <!-- Mobile overlay -->
  <div 
    *ngIf="sidebarOpen()"
    class="fixed inset-0 bg-black bg-opacity-50 z-40 md:hidden"
    (click)="sidebarOpen.set(false)">
  </div>

  <!-- Main content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Toolbar -->
    <app-admin-toolbar 
      (menuToggled)="toggleSidebar()">
    </app-admin-toolbar>

    <!-- Content area -->
    <div class="flex-1 overflow-auto p-4 md:p-6">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
