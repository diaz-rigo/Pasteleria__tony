<aside
  class="bg-white shadow-lg w-64 h-full fixed inset-y-0 left-0 transform transition-transform duration-200 ease-in-out z-30 md:translate-x-0 border-r border-gray-200"
  [class.-translate-x-full]="!open && isMobile"
>
  <!-- Header -->
  <div class="p-4 flex items-center justify-between md:justify-center border-b border-gray-200">
    <div class="flex items-center">
      <svg class="w-8 h-8 text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15.546c-.523 0-1.046.151-1.5.454a2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.701 2.701 0 00-1.5-.454M9 6v2m3-2v2m3-2v2M9 3h.01M12 3h.01M15 3h.01M21 21v-7a2 2 0 00-2-2H5a2 2 0 00-2 2v7h18zm-3-9v-2a2 2 0 00-2-2H8a2 2 0 00-2 2v2h12z" />
      </svg>
      <h1 class="ml-2 text-xl font-light text-gray-900">Pastelería<span class="font-medium">Admin</span></h1>
    </div>
    <button 
      (click)="close.emit()" 
      class="md:hidden text-gray-500 hover:text-gray-700 focus:outline-none"
      aria-label="Cerrar menú"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- User Profile -->
  <div class="p-4 border-b border-gray-200 flex items-center">
    <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center">
      <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
    </div>
    <div class="ml-3">
      <p class="text-sm font-medium text-gray-900">Admin User</p>
      <p class="text-xs text-gray-500">Administrador</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="p-4 h-[calc(100%-130px)] overflow-y-auto">
    <ul class="space-y-1">
      <li>
        <a 
          routerLink="dashboard" 
          routerLinkActive="bg-gray-100 text-gray-900 border-l-4 border-gray-900"
          [routerLinkActiveOptions]="{exact: true}"
          (click)="onLinkClick()"
          class="flex items-center p-3 text-gray-600 hover:bg-gray-50 rounded-lg transition-colors"
        >
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
          </svg>
          Dashboard
        </a>
      </li>
      <li>
        <a 
          routerLink="productos" 
          routerLinkActive="bg-gray-100 text-gray-900 border-l-4 border-gray-900"
          (click)="onLinkClick()"
          class="flex items-center p-3 text-gray-600 hover:bg-gray-50 rounded-lg transition-colors"
        >
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
          </svg>
          Productos
        </a>
      </li>
      <li>
        <a 
          routerLink="pedidos" 
          routerLinkActive="bg-gray-100 text-gray-900 border-l-4 border-gray-900"
          (click)="onLinkClick()"
          class="flex items-center p-3 text-gray-600 hover:bg-gray-50 rounded-lg transition-colors"
        >
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          Pedidos
        </a>
      </li>
      <li>
        <a 
       
          routerLinkActive="bg-gray-100 text-gray-900 border-l-4 border-gray-900"
          (click)="onLinkClick()"
          class="flex items-center p-3 text-gray-600 hover:bg-gray-50 rounded-lg transition-colors"
        >
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          Clientes
        </a>
      </li>
      <li>
        <a 

          routerLinkActive="bg-gray-100 text-gray-900 border-l-4 border-gray-900"
          (click)="onLinkClick()"
          class="flex items-center p-3 text-gray-600 hover:bg-gray-50 rounded-lg transition-colors"
        >
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          Reportes
        </a>
      </li>
    </ul>

    <!-- Divider -->
    <div class="border-t border-gray-200 my-4"></div>

    <!-- Settings -->
    <ul class="space-y-1">
      <li>
        <a 
          routerLink="configuracion" 
          routerLinkActive="bg-gray-100 text-gray-900 border-l-4 border-gray-900"
          (click)="onLinkClick()"
          class="flex items-center p-3 text-gray-600 hover:bg-gray-50 rounded-lg transition-colors"
        >
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          Configuración
        </a>
      </li>
      <li>
        <a 
          href="#" 
          class="flex items-center p-3 text-gray-600 hover:bg-gray-50 rounded-lg transition-colors"
          (click)="onLogout()"
        >
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Cerrar sesión
        </a>
      </li>
    </ul>
  </nav>
</aside>
