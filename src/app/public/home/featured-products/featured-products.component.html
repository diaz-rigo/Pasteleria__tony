<!-- featured-products.component.html -->
<div class="bg-white py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-7xl mx-auto">
    <!-- Encabezado se mantiene igual -->
    
    <!-- Products Grid -->
    <div *ngIf="!isLoading && !errorMessage" class="grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-3">
      <div *ngFor="let product of featuredProducts" class="group relative bg-gray-50 rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow duration-300">
        <div class="relative h-64 w-full overflow-hidden rounded-lg bg-white">
          <!-- Imagen -->
          <img [src]="getProductImage(product)" [alt]="product.name || 'Producto sin nombre'" class="h-full w-full object-cover object-center">
          
          <!-- Badges superiores -->
          <div class="absolute top-2 left-2 flex flex-col space-y-1">
            <div *ngIf="product.isFeatured" class="bg-black text-white text-xs font-bold px-2 py-1 rounded-full">
              Destacado
            </div>
            <div *ngIf="product.variants && product.variants.length > 1" class="bg-white text-black text-xs font-bold px-2 py-1 rounded-full border border-gray-300">
              {{product.variants.length}} sabores
            </div>
          </div>
        </div>
        
        <!-- Información del producto -->
        <div class="mt-4">
          <h3 class="text-lg font-bold text-gray-900 line-clamp-1">
            <a [routerLink]="['/productos', product._id]" class="hover:text-gray-600">
              {{product.name || 'Producto sin nombre'}}
            </a>
          </h3>
          
          <!-- Sabores disponibles -->
          <div *ngIf="product.variants && product.variants.length > 0" class="mt-2">
            <div class="flex items-center space-x-2">
              <span class="text-sm font-medium text-gray-700">Sabores:</span>
              <div class="flex flex-wrap gap-1">
                <span *ngFor="let variant of product.variants.slice(0,3)" 
                      class="text-xs px-2 py-1 rounded-full border" 
                      [style.backgroundColor]="(variant.color || '#000000') + '20'" 
                      [style.borderColor]="variant.color || '#000000'"
                      [style.color]="isLightColor(variant.color || '') ? '#000' : (variant.color || '#333')">
                  {{ variant.flavor }}
                </span>
                <span *ngIf="product.variants.length > 3" 
                      class="text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-800">
                  +{{ product.variants.length - 3 }} más
                </span>
              </div>
            </div>
          </div>
          
          <!-- Descripción corta -->
          <p *ngIf="product.description" class="mt-2 text-sm text-gray-600 line-clamp-2">
            {{product.description}}
          </p>
          
          <!-- Precio -->
          <div class="mt-3 flex justify-between items-center">
            <div>
              <p *ngIf="product.variants" class="text-lg font-bold text-gray-900">
                Desde ${{getStartingPrice(product) | number}}
              </p>
              <p *ngIf="hasPriceRange(product)" class="text-xs text-gray-500">
                (Varía según tamaño)
              </p>
            </div>
          </div>
          
          <!-- Botón de acción -->
          <div class="mt-4">
            <a [routerLink]="['/productos-detail', product._id]" class="w-full flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-black hover:bg-gray-800 transition-colors duration-200">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
              </svg>
              Ver detalles
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
