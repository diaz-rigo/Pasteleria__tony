<div class="container mx-auto px-4 py-12">
  <div class="mb-12 text-center">
    <h1 class="text-4xl font-bold tracking-tight text-gray-900 mb-3">NUESTRA REPOSTERÍA</h1>
    <div class="w-32 h-1 bg-black mx-auto mb-4"></div>
    <p class="text-gray-600 uppercase tracking-wider">Creaciones artesanales con los mejores ingredientes</p>
  </div>
  
  <div class="flex flex-col md:flex-row gap-8">
    <!-- Filters -->
<div class="md:w-1/5">
  <div class="bg-white p-6 rounded-sm border border-gray-200 shadow-sm sticky top-24">
    <h3 class="font-bold text-lg text-gray-900 mb-6 tracking-widest border-b border-gray-200 pb-3">FILTROS</h3>
    
    <div class="mb-8">
      <h4 class="font-semibold text-gray-900 mb-4 uppercase text-xs tracking-widest">Categorías</h4>
      <ul class="space-y-3">
        <li *ngFor="let category of categories">
          <label class="flex items-center">
            <input type="checkbox" class="rounded-sm border-gray-400 text-gray-900 focus:ring-gray-700 focus:border-gray-700">
            <span class="ml-3 text-gray-700 text-sm tracking-wide">{{category}}</span>
          </label>
        </li>
      </ul>
    </div>

  </div>
</div>
    

    <!-- Product List -->
    <div class="md:w-4/5">
      <div class="flex justify-between items-center mb-8 border-b border-gray-200 pb-4">
        <div class="text-gray-600 text-sm tracking-wide">
          <span class="font-bold">{{products.length}}</span> productos disponibles
        </div>
        <div>
          <select class="bg-white border border-gray-300 rounded-none shadow-sm focus:border-black focus:ring-black text-gray-700 text-sm tracking-wide px-3 py-2">
            <option>Ordenar por: Destacados</option>
            <option>Precio: Menor a Mayor</option>
            <option>Precio: Mayor a Menor</option>
            <option>Mejor calificados</option>
          </select>
        </div>
      </div>
      
      <div *ngIf="loading" class="flex justify-center py-12">
        <app-loading></app-loading>
      </div>
      
      <div *ngIf="!loading && products.length === 0" class="text-center py-12">
        <p class="text-gray-500 uppercase tracking-wider">No encontramos productos con estos filtros</p>
      </div>
      
      <div *ngIf="!loading && products.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        <app-product-card *ngFor="let product of products" [product]="product"></app-product-card>
      </div>
      
      <div *ngIf="!loading && products.length > 0" class="mt-12 flex justify-center">
        <nav class="inline-flex rounded-sm shadow-sm">
          <button class="px-4 py-2 border border-gray-300 bg-white text-gray-500 hover:bg-gray-100 text-sm tracking-wide font-medium">
            ← Anterior
          </button>
          <button *ngFor="let page of [1,2,3]" 
                  class="px-4 py-2 border-t border-b border-gray-300 bg-white text-gray-700 hover:bg-gray-100 text-sm tracking-wide font-medium"
                  [class.bg-gray-200]="currentPage === page"
                  [class.font-bold]="currentPage === page">
            {{page}}
          </button>
          <button class="px-4 py-2 border border-gray-300 bg-white text-gray-500 hover:bg-gray-100 text-sm tracking-wide font-medium">
            Siguiente →
          </button>
        </nav>
      </div>
    </div>
  </div>
</div>
