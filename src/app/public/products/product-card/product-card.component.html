<div
  class="product-card bg-white rounded-xl shadow-md overflow-hidden transition-all duration-300 hover:shadow-xl border border-gray-100 max-w-sm mx-auto">
  <!-- Imagen principal -->
  <div class="relative h-48 overflow-hidden">
    <img [src]="product.variants?.[0]?.images?.[0] || 'https://via.placeholder.com/400x300'" [alt]="product.name"
      class="w-full h-full object-cover transition-transform duration-500 hover:scale-105">
    <!-- Badge destacado -->
    <span *ngIf="product.isFeatured"
      class="absolute top-2 left-2 bg-black text-white text-xs font-bold px-2 py-1 rounded-full">
      DESTACADO
    </span>
  </div>

  <!-- Contenido de la tarjeta -->
  <div class="p-4">
    <!-- Encabezado -->
    <div class="flex justify-between items-start mb-2">
      <h3 class="text-xl font-serif font-bold text-gray-900">{{ product.name }}</h3>
      <span class="text-xs font-medium bg-gray-100 px-2 py-1 rounded-full">
        {{ product.category }}
      </span>
    </div>

    <!-- Rating -->
    <div class="flex items-center mb-3">
      <app-rating-stars [rating]="product.ratings?.average || 0" class="text-black"></app-rating-stars>
      <span class="text-xs text-gray-500 ml-1">
        ({{ product.ratings?.reviews?.length || 0 }})
      </span>
    </div>

    <!-- Descripción -->
    <p class="text-gray-600 text-sm mb-4 font-light">
      {{ (product.description || '') | truncate:120 }}
    </p>

    <!-- Variantes -->
    <div class="mb-4">
      <h4 class="text-sm font-semibold text-gray-900 mb-2">SABORES:</h4>
      <div class="flex flex-wrap gap-2">
        <div *ngFor="let variant of product.variants" class="flex items-center">
          <span class="w-3 h-3 rounded-full mr-1 border border-gray-300" [style.backgroundColor]="variant.color"></span>
          <span class="text-xs font-medium">{{ variant.flavor }}</span>
        </div>
      </div>
    </div>


    <!-- Sección de Precios -->
<div class="border-t border-gray-200 pt-4 mt-4">
  <h4 class="text-base font-semibold text-gray-800 uppercase tracking-wide mb-3">Precios</h4>
  
  <div class="space-y-3">
    <div *ngFor="let variant of product.variants" class="bg-gray-50 rounded-lg p-3">
      <h5 class="text-sm font-medium text-gray-700 mb-2">{{ variant.flavor}}</h5>
      
      <div class="divide-y divide-gray-200">
        <div *ngFor="let size of variant.sizeStock" class="py-2 flex justify-between items-center">
          <span class="text-sm font-normal text-gray-600">{{ size.size }} kg</span>
          <span class="text-sm font-semibold text-gray-900">{{ size.price | currency:'USD':'symbol':'1.2-2' }}</span>
        </div>
      </div>
    </div>
  </div>
</div>

    <!-- Botones -->
    <div class="mt-4 flex space-x-2">
          <button
           [routerLink]="['/productos-detail/', product._id]" [state]="{ product: product }"
        class="flex-1 bg-black text-white py-2 px-4 rounded-md text-sm font-medium hover:bg-gray-800 transition-colors">
        Ver detalles
      </button>
      <button
        class="flex-1 bg-white text-black py-2 px-4 rounded-md text-sm font-medium border border-black hover:bg-gray-50 transition-colors">
        Añadir al carrito
      </button>
    </div>
  </div>
</div>
